title: "Nimvault — OCI Object Storage Service Account Setup"
description: |
  [Nimvault WordPress Plugin]
  이 Stack은 Nimvault 전용 OCI 서비스 계정을 생성합니다.
  생성되는 리소스: IAM User + Group + Policy + API Key

  ⚠️ Stack 이름을 "Nimvault-OCI-Setup"으로 변경하는 것을 권장합니다.

  v2: 개인 키는 WordPress 사이트가 만들고 사이트를 떠나지 않습니다.
  Nimvault 설정에 보이는 공개 키를 아래 칸에 붙여넣으세요.
  완료 후: Outputs 의 nimvault_callback_url 을 누르면 자동으로 연결됩니다.
schemaVersion: 1.1.0
version: "2.1.0"
locale: "en"

variableGroups:
  - title: "Step 1 — Where is your bucket?"
    variables:
      - region
      - compartment_ocid

  - title: "Step 2 — Your WordPress site"
    variables:
      - nimvault_public_key_pem
      - nimvault_site_url

  - title: "Advanced (optional)"
    variables:
      - service_user_name
      - service_user_email

  - title: "Hidden"
    visible: false
    variables:
      - tenancy_ocid

variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    required: true

  region:
    type: oci:identity:region:name
    title: "Region"
    description: "Select the region where your Object Storage bucket lives"
    required: true

  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Select the compartment that contains your bucket. Nimvault will only access this compartment."
    required: true

  nimvault_public_key_pem:
    type: text
    multiline: true
    title: "Nimvault public key"
    description: "Copy the public key from Nimvault Settings and paste it here. It is not a secret; the private key stays on your site."
    required: true

  nimvault_site_url:
    type: string
    title: "WordPress site URL"
    description: "Your site URL (e.g. https://myblog.com). This creates a link that takes you back to WordPress with everything pre-filled. Leave empty to copy manually."
    default: ""
    required: false

  service_user_name:
    type: string
    title: "Service user name"
    description: "Name for the Nimvault service account (no console login, API only)"
    default: "nimvault-service"
    required: true

  service_user_email:
    type: string
    title: "Service user email"
    description: "Email address for the service account (required by OCI Identity Domains). Can be any email."
    default: "nimvault-service@nimvault.cloud"
    required: true


outputGroups:
  - title: "Setup complete — return to WordPress"
    outputs:
      - nimvault_setup_instructions
      - nimvault_callback_url

  - title: "Connection details (for manual setup or JSON import)"
    outputs:
      - nimvault_tenancy_ocid
      - nimvault_user_ocid
      - nimvault_fingerprint
      - nimvault_region
      - nimvault_compartment_name
